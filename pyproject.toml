[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mttn-autosubs-tool"
version = "1.2.0"
description = "MTTN AutoSubs Tool by La Matatena — Local Spanish AI subtitle studio and DaVinci Resolve 20 companion tuned for Intel & Apple Silicon macOS."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mttn-autosubs-tool = "autosubs_server:main"
mttn-autosubs-pack = "package_bundle:main"
autosubs-es = "autosubs_server:main"
autosubs-es-pack = "package_bundle:main"

[tool.setuptools]
py-modules = [
  "autosubs_server",
  "exporters",
  "font_manager",
  "hardware_imac2017",
  "machine_settings",
  "package_bundle",
  "resolve_bridge",
  "spanish_nlp",
]
