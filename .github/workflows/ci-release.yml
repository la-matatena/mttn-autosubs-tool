name: CI & Release

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "tweak/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Formatting and lint checks (dev-only tools, pinned to the versions in
  # tools/lint.sh). Runs in parallel with test-and-package; a lint finding
  # fails the workflow but never gates the release build/publish job.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install pinned lint tools
        run: |
          python -m pip install pyink==26.5.1 pylint==4.1.3 shellcheck-py==0.11.0.1
          npm install --global --registry https://registry.npmjs.org/ \
            prettier@3.10.1 eslint@10.14.0 @johnnymorganz/stylua-bin@2.6.0

      - name: Run tools/lint.sh
        run: tools/lint.sh

  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Node is a dev-only dependency: it runs the UI helper unit tests with
      # the built-in test runner (no npm install, no package.json).
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run UI JavaScript unit tests
        run: node --test "tests/js/*.test.mjs"

      - name: Run MTTN AutoSubs Tool unit & integration tests
        run: python3 -B autosubs_es_test.py -v

      - name: Build verified MTTN_AutoSubs_Tool.zip bundle
        run: |
          mkdir -p dist
          python3 -B package_bundle.py --output dist/MTTN_AutoSubs_Tool.zip

      - name: Upload workflow build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTTN_AutoSubs_Tool
          path: dist/MTTN_AutoSubs_Tool.zip

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PRERELEASE_ARGS=()
          if [[ "${TAG_NAME}" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi
          gh release create "${TAG_NAME}" \
            dist/MTTN_AutoSubs_Tool.zip \
            --title "MTTN AutoSubs Tool ${TAG_NAME}" \
            --generate-notes \
            "${PRERELEASE_ARGS[@]}"
