name: CI & Release

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "tweak/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AutoSubs ES unit & integration tests
        run: python3 -B autosubs_es_test.py -v

      - name: Build verified AutoSubs_ES.zip bundle
        run: |
          mkdir -p dist
          python3 -B package_bundle.py --output dist/AutoSubs_ES.zip

      - name: Upload workflow build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoSubs_ES
          path: dist/AutoSubs_ES.zip

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PRERELEASE_ARGS=()
          if [[ "${TAG_NAME}" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi
          gh release create "${TAG_NAME}" \
            dist/AutoSubs_ES.zip \
            --title "AutoSubs ES ${TAG_NAME}" \
            --generate-notes \
            "${PRERELEASE_ARGS[@]}"
