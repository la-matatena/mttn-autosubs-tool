# StyLua config for the DaVinci Resolve scripts in lua/ (dev-only; run
# through tools/lint.sh). Matches the existing 2-space, double-quote style.
column_width = 100
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"
